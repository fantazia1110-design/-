<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>مسنجر برودكاستر</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#0090ff" />
              <stop offset="0.5" stop-color="#6a5cff" />
              <stop offset="1" stop-color="#ff5c87" />
            </linearGradient>
          </defs>
          <rect width="24" height="24" rx="5.4" fill="url(#lg)" />
          <path
            transform="translate(5.1 5.1) scale(0.575)"
            fill="#fff"
            d="M12 2C6.48 2 2 6.05 2 11.05c0 2.83 1.36 5.36 3.5 7.02V22l3.2-1.76c1.03.28 2.12.44 3.3.44 5.52 0 10-4.05 10-9.05S17.52 2 12 2Zm5.6 7.2-3.02 4.8a1.5 1.5 0 0 1-2.16.55l-2.4-1.8a.6.6 0 0 0-.72 0l-3.25 2.47c-.43.33-.99-.19-.7-.65L8.37 9.4a1.5 1.5 0 0 1 2.16-.55l2.4 1.8a.6.6 0 0 0 .72 0l3.25-2.47c.43-.33.99.19.7.65Z"
          />
        </svg>
        <span class="title">مسنجر برودكاستر</span>
      </div>
      <div class="bar-actions">
        <span id="originLabel" class="pill" dir="ltr"></span>
        <button id="reload" type="button" title="إعادة تحميل">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10" />
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
          </svg>
        </button>
        <button id="settings" type="button" title="إعدادات الخادم">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
        <button id="openTab" type="button" title="فتح في تبويب كامل">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
            <polyline points="15 3 21 3 21 9" />
            <line x1="10" y1="14" x2="21" y2="3" />
          </svg>
        </button>
      </div>
    </header>

    <main class="frame-wrap">
      <iframe id="app" title="مسنجر برودكاستر" allow="clipboard-read; clipboard-write"></iframe>
    </main>

    <div id="setupOverlay" class="overlay" hidden>
      <div class="overlay-card">
        <h2>رابط خادم البرنامج</h2>
        <p>ألصق رابط استضافة البرنامج (يبدأ بـ https) — يُحفظ مرة واحدة ويمكن تغييره لاحقًا من أيقونة الترس بالأعلى.</p>
        <input id="originInput" dir="ltr" type="url" placeholder="https://your-server.com" />
        <p id="originError" class="origin-error" hidden></p>
        <button id="saveOrigin" type="button">حفظ وتشغيل</button>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
